name: my-scenario
description: "An example manifest for the orchestrator - replace with your description."

# Values the scenario needs. `scenario.yaml` is the single source of truth;
# required values must be filled in here before the first step. Generated
# secrets and step outputs are persisted by Go in the private scenario state.
# ${VAR} / ${VAR:-default} can be used in step args and step env.
env:
  - name: LAB_VM_PASSWORD
    required: true
    description: "Set a local VM password here; do not commit it"
  # - name: KVM_STORE_DIR
  #   value: ".runtime/kvm"
  #   path: true

steps:
  - id: check-dependencies
    type: sh
    path: infra/scripts/dependencies-check.sh
    description: "Checks that the dependencies are present on the machine"

  - id: kvm-network-creation
    type: sh
    path: infra/scripts/kvm-net-creation.sh
    description: "Create the necessary network bridges and interfaces"

  - id: mikrotik-vm-creation
    type: sh
    path: infra/scripts/mikrotik-router.sh
    description: "Create the mikrotik vm"

  - id: bastion-vm-creation
    type: sh
    path: infra/scripts/bastion/provisionner.sh
    description: "Create the bastion vm"

